front:
  text: 淨土生無生論親聞記序記稱親聞者表稟承非謬也教髫年出家即隨師祖大和尚往括蒼普慈寺聽講圓覺末聽此論聯翩浹旬爾時敷文極暢闡義至精座下聽眾無有一人若身若心生懈倦而不開悟者惟教神根既鈍兼之童稚無知若聾瞽觀場不過隨人泣笑而已既返幽溪年齒漸進而好樂之念日臻非但數聽數承兼復屢請屢問隨聞隨記散葉盈函既無疑而不決亦無義而不詳苟不貫之集之何以益人益己若夫方言巧拙可曰責在我躬其於造詣情微敢將質諸來哲入門者請徑升堂而飡甘露種種問橋非所急也皇明天啟六年歲在丙寅春王正月天台山幽溪後學沙門受教下筆序淨土生無生論序昔楊次公云贊輔彌陀教觀者其書山積唯天台智者大師十疑論最為首冠寧詎知後次公六百許年而更出我幽溪和尚生無生論乎括海藏以十門融億剎於一念廣古德之未備闡今人所未聞往生奧義若指諸掌蓋自其三昧流出故不可得而思議生今之世獲覩是論罔知猛省求生豈不大可哀哉發起之由實始不慧故亟圖剞劂用布大慈願戴髮含齒盡未來際普霑法乳悉悟無生至若讚是功德則有十方恒沙諸佛廣長舌在毛道凡夫聊序其大都爾門人四明聞龍和南撰
