body:
  text: 幽溪法孫受教記解釋此論科分為三初釋論題淨土生無生論論題六字義具三重能所所謂能生所生能融所融能論所論也初能生所生者淨土二字為所生生之一字為能生所生淨土即從是西方過十萬億佛土有世界名曰極樂約其土體具有四種謂凡聖同居土方便有餘土實報莊嚴土常寂光土能生之人即娑婆世界念佛眾生體為二種一分段身二變易身若分段生死之人則四種淨土皆可求生若變易生死之人則惟求生上之三土或二土一土如韋提希本是凡夫厭同居穢欣同居淨秪由隨聞十六玅觀三惑一心頓破即於當座悟無生忍不惟分見實報亦乃分證寂光非分段身可求生四土乎故約分段收機則廣約變易收機則狹故我娑婆具四土機惟在進解與造行何如又此二種具四教機及悠悠凡夫雖具四教等然皆回小向大回徧向圓總成一種圓頓之機爾二能融所融者淨土生三字為所融無生二字為能融謂以無生而融其生以生而濟其無生所謂理因事濟雖一道不礙千差事得理融縱萬殊無離一性是也葢無生真如之理苟無四種淨土與夫二種能生之機則性具之理終晦而不顯然而雖知有是事矣苟不知事全即理則四種淨土與夫二種能生之機終離而不融是故圓頓行人修淨土者須以事而濟乎理熾然求生以理而融乎事生即無生是則終日生而未嘗外乎無生終日無生而不妨乎生豈與夫尚理者觸言而賓無定謂無土可生尚事者觸言而宗有定謂有土可生可同年而語哉三能論所論者淨土生無生五字為所論論之一字為能論此論以析微為宗斷惑為趣析微則無理不彰斷惑則無疑不破可謂圓頓了義之指南三身四土之心宗也若以六字論廣狹者淨土生三字約事則狹無生二字約理則廣又淨土生三字事相繁多則廣無生二字理一則狹今以事而濟乎理理乃事中之理以理而融乎事事乃理中之事會而歸之則非事非理亦非廣非狹也又淨土生無生五字屬所詮理事則廣論之一字屬能詮文字則狹又論為能詮包含所詮義理則廣上五字惟是所詮所含則狹若曰無離文字以說解脫即文字以為總持則非能詮非所詮亦非廣非狹也若以論題往收十門則各有攝屬一真法界門則冠一論而淨土生無生五字俱該若身土緣起門則淨土二字之事三心土相即門四生佛不二門亦淨土生無生俱該五法界為念六境觀相吞七三觀法爾此之三門則生無生三字義兩攝屬蓋為念與境觀三觀皆生字邊事若夫法界與相吞法爾則無生二字邊事也第八感應任運第九彼此恒一第十現未互在此之三門亦兩攝屬如感應彼此現未六字則生與淨土三字邊事若夫任運恒一互在則無生二字邊事也其不然者則題目與論兩不相稱何以契貫散二華總別之妙哉至於五重釋題乃天台解經通軌以之釋論終帶牽強況諸師業有私說茲不繁用大莊嚴論云造論凡有五義一者如金成器令信解故二者如華開敷開示彼故三者如食美膳得法味故四者如解文字令修習故五者如開寶篋實證得故今亦具含五義採集諸經以成一論如金成器也論立十門門詮眾妙如華開敷也理明性具境會惟心如食美膳也既悟圓修知土由心變如解文字也性中極樂由修顯發如開寶篋也二釋作人天台山幽溪沙門傳燈著大師字無盡別號有門三衢姑蔑人出家天台居智者幽溪道場四十餘年傳弘天台教觀其所著述有楞嚴玄義圓通疏前茅圓通疏海印三昧謂之楞嚴四書又著淨名無我疏彌陀圓中鈔永嘉集註般若融心論性善惡論幽溪文集等今無生論是其一也其生平履踐行實具韓求仲太史所著高明寺與教私記年譜茲不備述三釋正文大師講此論時已有分判今依舊科毫無所加大科為二初皈命述意二依義立論初中三初稽首三寶三初兩土佛寶稽首能仁圓滿智無量壽覺大導師菩薩造論弘經必先皈命三寶者有二意一歸宗有在知非臆說二懇請冥加不致紕謬吾祖亦然稽首即皈命之義葢人之所重莫大於命命之所尊莫大於首今以最尊之首稽叩於三寶足下表我身命無他所歸獨歸於三寶之至尊也能仁等者此土教主梵語釋迦牟尼此云能仁寂默能仁彰其用寂默顯其體今略稱能仁者以寂默智在於默今存智在於說故云能仁能仁是別號通號有十第十名佛佛者覺也亦智也天台釋此有六種即今云圓滿智乃究竟覺然與眾生理性無二無別故觀經疏明理即佛云此是圓智圓覺諸法徧一切處無不明了法智大師云此是者指大經眾生即佛等皆是本性圓覺非三般若融即微妙智不名圓知一切法一一含受一切諸法全法是智全智是法待對斯絕名圓覺諸法云云然則眾生雖具無了因力全以三智而為三惑惟佛與佛乃能究盡諸法實相邊際智滿種覺果圓是故稱佛為圓滿智無量壽覺即西土教主阿彌陀佛此中已翻為覺故上以智代大導師者法華疏具列四種謂通途慈悲結緣權實二智若從踈洎親今是二智亦具上二種能仁則折以權道從娑婆此岸將導之無量壽則攝以實道從極樂彼岸接引之又能仁示以即實而權無量壽示以即權而實故二世尊皆得稱圓滿智大導師互存無在也次兩土法寶所說安養大乘經了義了義至圓頓佛之度生示以形聲二益形則現身現通聲則以說以默上所皈命佛以形益也今所歸命法以聲益也或問說為聲益可爾默既無言何為聲益答曰默為無聲乃說之待令人得益故亦聲益所說安養大乘經且就娑婆教法說極樂世界事者為言義實含乎安養依正二報所宣之法了義等者讚佛所說淨土法門乃即權而實即實而權其中義理無不了了也圓頓者圓則圓滿具足頓則即心即佛至圓頓者謂圓頓之至也應云圓頓中之圓頓了義圓頓皆重言之者如華嚴法華皆了義圓頓之教而此二經皆讚淨土往生法門豈非了義中之了義圓頓中之圓頓乎如十念七日專持名號若得往生便階不退何有了義圓頓更過于此慈雲大師所謂了義中之了義大乘中之大乘是也三兩土僧寶二初菩薩僧妙德普賢觀自在勢至清淨大海眾妙德等諸大菩薩名號已翻梵為華若翻華為梵則妙德梵語文殊普賢梵語秘輸陀觀自在梵語婆婁吉仾輸勢至梵語摩訶那鉢妙德普賢則為能仁左右輔弼揚化弟子觀音勢至則為無量壽左右輔弼弟子或在華嚴或在法華或在方等如來宣說清淨平等覺經無量壽經觀無量壽經小彌陀經鼓音王等經時莫不碪椎相扣主伴擊揚以成淨佛國土之機以攝往生清淨之眾在此菩薩既爾在彼大士亦然譬如一主二臣動靜必俱至於清淨海眾皆法門之先達華池之勝友凡是西方僧寶一一頂禮皈依次聲聞僧問曰此等諸師亦大菩薩云何以聲聞稱之答曰傳持佛法現聲聞相故以佛道聲令一切聞故馬鳴龍樹及天親此土廬山蓮社祖天台智者并法智古往今來弘法師馬鳴菩薩即西天第十二祖著起信論發明繫念西方最為切要龍樹菩薩西天第十四祖南天竺人於九旬內誦通三藏深入法忍造大悲方便論大無畏論又著十住婆沙智度論等多讚西方勸人念佛有偈云若人願作佛心念阿彌陀即得為現身故我皈命禮一家宗之為始祖云天親菩薩北天竺人造唯識金剛般若等論仍著無量壽論有求生淨土偈及五門修法蓮社祖者蓮社祖有七初祖晉慧遠法師俗賈氏雁門人學通儒老年二十餘見道安法師因聽講般若豁然開悟乃曰九流異議皆糠粃耳後入廬山刺史桓伊創東林居焉影不出山者三十餘年每送客遊履常以虎溪為界時息心緇侶絕塵信士不期而至望風遙集共一百二十三人結為蓮社名跡尤著者一十八人六時禮誦精進不退十年三覩聖相後般若臺定起見彌陀佛身滿虗空圓光之中有諸化佛觀音勢至侍立左右又見水流光明分十四支流注上下演說苦空佛告遠曰我以本願力故來安慰汝汝後七日當生我國後七日果終有雜文十卷號廬山集盛行於世事詳本傳文繁不錄此土念佛實始於遠故稱為初祖焉二祖長安善導光明法師三祖南岳承遠般舟法師四祖長安法照五會法師五祖新定少康臺巖法師六祖永明延壽智覺法師七祖昭慶省常圓淨法師智者大師諱智顗華容人俗姓陳氏生時靈瑞不一七歲入果願寺聞誦法華普門品忽自憶記宛如夙習十五歲禮佛像誓志出家十八薙落二十進受具戒天嘉五年謁光州大蘇山慧思禪師事詳本傳今不具錄嘗著十六觀經疏并十疑論後於剡東石城彌勒像前令弟子唱十六觀經名誡眾曰四十八願莊嚴淨土香臺寶樹易往無人火車相現一念改悔者尚得往生況戒定熏修聖力道行終不唐捐言訖趺坐而化法智大師諱知禮字約言金姓四明人從寶雲通公傳天台教觀出世承天繼住延慶戶外屨滿嘗行法華般舟三昧期生安養後與十僧結社約修懺三年自焚其身決取淨土楊文公億再三勸留始允其請著妙宗鈔以釋觀經義疏人到于今咸受其賜古往今來弘法師者古往即過去諸大耆宿等今即現在諸大知識等來即當來紹繼宗風者凡有一句一偈贊及西方者悉皆皈依也次皈命求加我今皈命禮三寶求乞冥加發神識皈命求加以發神識則所論者方上契佛心中合祖意可以下度含識楞嚴經云若有決定發菩提心受持此呪者此諸金剛藏王精心陰速發彼神識云云是也三述造論意敬採經論秘密旨闡揚淨土生無生普使將來悟此門斷疑生信階不退此論所明淨土生即無生生化兩冥之旨皆吾祖敬採經論所詮秘密之道毫無臆說然於經則旨在言表於論則旨在詮中觀其所用則觀經䟽妙宗鈔其義居多要知惟心淨土本性彌陀之理非天台性具宗旨不明非吾祖深契祖心不悟是則四明可謂深契佛祖之心宗吾祖可謂妙悟法智之骨髓也將來讀此論而悟此宗者尚何深疑之不斷何圓信之不生何不退之不階哉次依義立論二初總列十門將造此論立為十門一一真法界門二身土緣起門三心土相即門四生佛不二門五法界為念門六境觀相吞門七三觀法爾門八感應任運門九彼此恒一門十現未互在門問曰今此十門幾迷幾悟幾事幾理幾因幾果答曰一真法界非迷非悟身土緣起有迷有悟餘之八門皆屬於悟一真法界一往言之屬理再往言之能具一真法界屬理所具十種法界屬事然離能具無所具離所具亦無能具是則亦事亦理非理非事身土緣起既全理而為事且作屬事其實事理兼屬餘之八門皆即事即理一真法界約能具則非因非果約所具亦因亦果九界屬因佛界屬果故也身土緣起亦因亦果心土相即生佛不二亦通因果法界為念境觀相吞三觀法爾此之三門屬因感應任運彼此恒一現未互在此之三門皆屬於果真俗體用亦如是說夫門名能通如世門戶通人出入故門義甚多今且約三種圓覺云有大陀羅尼門名為圓覺流出一切清淨真如佛性乃以理為門也楞嚴云歸元性無二方便有多門乃以行為門也法華云其智慧門難解難入又曰以佛教門出三界苦乃以教為門也今是教門即以此論而為能入之門令人從教門悟入一真法界乃至悟入現未互在義故次別釋十門初二門明根圓融具次八門明枝流妙即初二門明根源融具二初一門明理性本具次一門明事造方融初中二初標初一真法界門一真法界者一則不二真則不妄不妄不二是真法界此則以無法為法無界為界乃以一真如妙性而為法界也種種義味具如下釋次釋二初述偈立宗二依宗釋義西天祖師凡有破立必先說偈以為論本然後約義門而解釋之今亦倣此故先說偈一真法界中具足十法界依正本融通生佛非殊致一真法界即中道法性有二種一但中如雲外月逈出二邊是故真俗及十界依正皆非性具獨以無身無土無生無佛者而為法身如是之人與談惟心本性可也談惟心淨土本性彌陀莫之可也一圓中如如意珠即體圓即瑩徹即具寶雖是一珠而有三義雖是三義但是一珠故曰一真法界中具足十法界依正本融通生佛非殊致是以能悟此性具十界依正融通生佛無殊者雖終日求生而生即無生雖無生而不妨熾然求生豈與夫談無生則礙於生談生則礙於無生者可同日而道哉余謂談淨土者苟微性具之旨則惟心與淨土必岐為二一真法界性具法門可不專務熟講哉次依宗釋義二初正釋次料簡初中二初詳釋勝義二結成宗偈初又二初直指人心論曰一真法界即眾生本有心性一真法界約果而言即諸佛之所證得今約因而言故曰眾生本有心性是則眾生諸佛惟約迷悟而分若夫性體則生佛非殊以非殊故生佛不二以迷悟故因果差殊今指不二者以為惟心淨土本性彌陀生即無生之論本下之九門莫不本乎此次指心具德二初列二義此之心性具無量德受無量名此之心性指眾生在因在迷之理性然與佛在果在悟之證性無二無別故能具無量德受無量名惟其具此故彌陀即我之本性淨土即我之惟心是以無生而生生即無生具無量德受無量名者大經云世諦但有名無實義第一義諦有名有實義今約眾生所具第一義諦與佛究竟第一義諦無少差殊故也次釋二義二初釋具無量德二初徵德舉要云何具無量德舉要言之謂性體性量性具德既無量不能枚舉今舉其要三性攝盡眾生迷此而變為三惑諸佛悟此而轉為三德皆當體即是故云變云轉也次據德釋義三初正釋三德次指同三諦三引楞嚴證初中二初次第釋義次融通其理初中三初釋性體云何性體謂此心性離四句絕百非體性堅凝清淨無染不生不滅常住無壞有無等四句但可名目世間法一真法界如大火聚四邊不可凑泊是故若言其有成增益謗若言其無成損減謗若言雙亦成相違謗若言雙非成戲論謗絕百非者四句為本每句具足四句成十六句約三世各十六句成四十八句加已起未起成九十六句加根本四句共百句句句皆非故云百非體性堅凝者此之性體如金剛寶萬物不能壞能壞一切萬物一切者煩惱生死也故此心性處煩惱海若驪珠而獨耀居生死岸如桂輪而獨朗故曰清淨無染不生不滅常住無壞次釋性量云何性量謂此心性豎窮三際橫徧十方世界有邊虗空無邊虗空有邊心性無邊現在有邊過未無邊過未有邊心性無邊無盡無盡無量無量心性之量乃以無量而為之量有量之量必為三世之所遷移十方之所局限有遷移故則有生滅有局限故則有去來今之心性既竪窮乎三世復橫徧乎十方尚何生滅去來能遷移為局限哉夫世界固無邊矣有漏微塵國皆依空所生是則世界又有邊也虗空固無邊矣空生大覺中如海一漚發虗空又有邊也現在無住本無分齊矣以過去無始未來無終言之現在有邊過未無邊也過去未來本無涯涘矣以心性言之過未有邊心性無邊也總而言之秪可言其無盡無盡無量無量而已三釋性具云何性具謂此心性具十法界謂佛法界菩薩法界緣覺法界聲聞法界天法界修羅法界人法界畜生法界餓鬼法界地獄法界此是假名復有正報謂佛五陰菩薩五陰乃至地獄五陰此是實法復有依報謂佛國土菩薩國土乃至地獄國土祖師云只一具字彌顯今宗以性具善他師亦知具惡緣了他皆莫測今家之言性具者十法界也若單言性具佛界性善緣因性淨了因善淨不二即善正因如是之義何經不譚何師不說惟性具九界性惡緣因性染了因染惡不二即惡正因非華嚴法華維摩圓覺楞嚴而不談非智者荊溪四明幽溪而不闡也此是假名名者實之賓有假名必有實法即十界五陰有正果必有依報即十界國土如是依正居一性中即之彌分派之彌合此之性具既即性體性量故荊溪大師云十方淨穢卷舒同在於剎那一念色心包羅徧収於法界並天真本具非緣起新成得此為本然後可以譚惟心淨土本性彌陀也初次第釋義竟次融通其理令易解故作三種分別得意為言即性具是性體性量性體離過絕非即性具十界離過絕非性體堅凝清淨無染不生不滅常住不壞性具十界亦然性量竪窮橫徧無盡無盡無量無量性具十界亦然正報五陰同性體性量清淨周徧依報國土亦然令易解者為初機也得意言者從實際也是以非開張不足以生解非融通不能令得意蓋性之三德本是一體故趣舉一德一必具二體既如是餘亦復然今文正意為明性具是故文中先舉性具以為語端然後以體量即而融之莫不同體之與量離過絕非乃至無量無量雖正意在具而言中之意又在眾生五陰即佛界五陰眾生國土即佛國土故曰性具十界既爾正報依報亦然初正釋三德竟次指同三諦此之三法亦名三諦性體即中諦性量即真諦性具即俗諦此之下總指大體性體下別指方隅性體即中諦以以其絕待故能統一切法也性量即真諦者以其廓徹故能泯一切法也性具即俗諦者以其具足十界故能立一切法也此中指同三諦以為下文引證張本三引楞嚴證二初引果德文次引因性文意謂若無果德文證則眾生性具同於流轉若無因性文證則如來果德涉乎修證二義善成方悟一切諸佛但證眾生理本一切眾生但迷諸佛圓成今先引果德文三初證性量真諦故楞嚴經云而如來藏本妙圓心非心非空非地水火風非眼耳鼻舌身意非色聲香味觸法非眼界乃至非意識界非無明乃至非老死非無明盡乃至非老死盡非苦集滅道非智非得非檀那乃至非般剌若非怛闥阿竭非阿羅訶非三耶三菩非常樂我淨此即性量無相是為真諦佛說三諦有二種一圓融三諦二隔歷三諦如仁王瓔珞所明者隔歷三諦也三諦隔歷各不相收如曰真則纖塵必盡俗則萬法皆成中則二邊叵得是也楞嚴所明者圓融三諦也三諦圓融不可思議舉一即三如曰真則萬法昭然俗則纖塵必盡中則絕待雙融是也今文所引乃不思議大真諦如十界俱非非真諦乎此中最初非心空根塵識三留守本諦而凡情俱盡可也而又併十二因緣四諦二乘之法而俱非之豈非本諦之空而亦空乎乃至六度三號四德俱非豈不菩薩佛果中道而俱空乎正天台所謂一空一切空無假無中而不空也次證性具俗諦而如來藏元明心妙即心即空即地水火風即六凡即二乘乃至即如來常樂我淨此則性具十界是為俗諦此中所引乃不思議大俗諦如十界俱即非俗諦乎至於中間即六凡法界此留守本諦而森羅昭然可也而又併十二因緣四諦而俱即之豈非二乘真諦而亦立乎乃至六度三號四德俱即豈不菩薩佛中道而俱立乎正天台所謂一假一切假無空無中而不假也三證性體中諦而如來藏妙明心元離即離非是即非即此即性體統攝是為中諦此中所引乃不思議大中諦如十界俱離即離非是即非即非中諦乎至於末後六度三號四德俱離即離非是即非即此留守本諦中道雙遮雙照可也而又併六凡而離即離非是即非即豈非俗亦中乎又併二乘而離即離非是即非即是非真亦中乎正天台所謂一中一切中無真無俗而不中也而此十界三諦乃如來果地以妙明不滅不生合如來藏而如來藏圓照法界究竟之相既有假名豈無五陰國土四明云至於果成十皆究竟此之謂也次引因性文為二初證性中三德又云如來藏性色真空性空真色清淨本然周徧法界地水火風空見識莫不如是地水火風空見識即性具也清淨本然即性體也周徧法界即性量也眾生因性所有依正二法不外七大一一大既皆稱性即性具也又一一皆云清淨本然周徧法界即性具之法即性體性量莫不體性堅凝清淨無染一一稱性周徧法界也次證具即三德又云地水火風空清淨本然周徧法界即依報國土性體性量也見識清淨本然周徧法界即正報五陰性體性量也上證性中三德義猶統總今證具即三德乃約性中所具七大分依正二報即性體性量豈非楞嚴一經即明性具法門與體德量德無二無別哉次釋受無量名二初徵名舉要云何受無量名舉要言之此之心性或名空如來藏或名真如佛性或名菴摩羅識或名大圓鏡智或名菩提涅槃天台大師云佛有無量德應有無量名舉一蔽諸今亦例立性有無量德應有無量名舉七以蔽諸此之七名本出楞嚴彼明如來果位七名溫陵師云一法不立煩惱蕩盡曰空如來藏不忘不變曰真如離過絕非曰佛性分別一切而無染著曰菴摩羅識洞照萬法而無分別曰大圓鏡智諸佛所得曰菩提寂靜常樂曰涅槃今引證眾生心性者眾生性具之德含藏一切而無積聚故名空如來藏性體性量本來清淨不妄不變故名真如性體性量離過絕非故名佛性性體性量如杲日昭昭分別一切而無染著故名菴摩羅識性體性量洞照萬法而無分別故名大圓鏡智性體性量即圓明大覺故名菩提性體性量具常樂我淨故名涅槃以其具足三因及五佛性故也次融通名德性體性量名空如來藏即性具十界五陰國土名空如來藏性體性量名真如佛性即性具十界五陰國土名真如佛性乃至性體性量名菩提涅槃即性具十界五陰國土名菩提涅槃前明三德中既已融通其理即性具是性體性量今文復融通名之與德性體性量名空如來藏即性具十界五陰國土名空如來藏等然則惟心淨土本性彌陀生即無生可不信諸何也蓋十界依正既皆性具即性體性量而名之與德性本融通是則眾生在理迷則俱迷不惟迷於九界即佛界亦復成迷諸佛究竟悟則俱悟不惟悟於佛界即九界亦復成悟迷時即寂光金寶而轉為苦域泥沙悟時則同居泥沙而轉為寂光金寶此猶約捨穢究竟取淨窮源而說若淨穢平等無捨無取豈不以究竟苦域泥沙以為寂光金寶以至果成十皆究竟故也以是而言則理性苦域泥沙即性體性量一一稱性離染周徧豈不娑婆穢土原徧西方極樂果人不離此土生即無生無生而生之義成矣次結成宗偈故曰一真法性中具足十法界依正本融通生佛非殊致結前引楞嚴因果二性立宗述偈其義善成是則世人一切疑惑悉應於此一真法界門中一時頓斷但世間之疑有倒有正若涉事尋常耳目見聞者則信其有六合之外不見不聞者則疑其無此疑之正者也又有遠大之事非見聞所及反信其有近小之事見聞所及反疑其無此疑之倒者也若眾生心性之三德性體性量乃果地之所究竟非眾生耳目所及者反信其有一言性具之德現前一念本來具足反疑其無楞嚴所謂如我垂手等無有異此等名為迷中倍人是也又有能信具佛界不信具九界者能信具四聖不信具六凡者能信具三善道不信具三惡道者能信具十界正報不信具十界依報者此等皆得名為迷中倍人也次料簡二初難初後俱墮問曰此一真法界為初心是為後心是若初心是應無七名若後心是應無九界初後俱墮立義不成此一真下立二難本若初心下建立二難初後俱墮下結成難勢初心者理即位人也後心者究竟位人也初心應無七名者以果難因以顯難隱也後心應無九界者以因難果以隱難顯也天台大師云事可比知如孫劉相顯瞭然在目理具難知如曹公相隱解衣方見然此隱顯佛與眾生皆各有之若諸佛果人則佛界顯而九界隱眾生因人則佛界隱而九界顯以之合喻則曹公天子相隱而奸雄相顯先主帝王相顯而梟雄相隱隱顯似殊性具不異也次釋初後俱善二初釋次結初中二初據難立義答曰此正顯初心是以初心是故方有後心是以後心是故方顯初心是此者指前立宗述偈一真法界中具足十法界等也正顯初心是者前所說具無量德受無量名皆理即初心當體即是惟即是故方有果地究竟後心即是然非初不能顯後非後不能顯初下文明之次依義釋難二初立義云何以初心是方有後心是如果地依正融通色心不二垂形九界方便度生悉由證此因心所具果地六句初二句法報二身寂光實報二土法身則以虗空為座即身即土即土即身故曰依正融通報身即以實報為土常住五陰而為色心全法性起故云不二良由本具今得究顯次垂形二句從大體以起大用苟非性具九法界者至此果成何能繁興大用哉悉由下結成上義次引證二初泛引故曰諸佛果地融通但證眾生理本故得稱性施設無謀而應若不然者何異小乘外道作意神通諸佛果地二句證初二句大體故得稱性二句證次二句大用若不然下舉劣況勝小乘神通作意而有外道神通依物而成秪由無本可據故也次的引前汎引亦是天台祖教未明指人故成泛引今則明指法智大師妙宗鈔文故名的引故法智大師云六即之義不專在佛一切假實三乘人天下至蛣𧏙地獄色心皆須六即辨其初後所謂理蛣𧏙名字乃至究竟蛣𧏙以論十界皆理性故無非法界一不可改故名字去不惟顯佛九亦同彰至於果成十皆究竟文有二段初泛明既曰六即之義不專在佛是則不惟理即性具十界分真究竟亦約十界而判一切假實總舉假名一千五陰一千國土一千不專在佛即佛界三乘即聲聞緣覺菩薩三法界人天下至該修羅餓鬼四法界蛣𧏙畜生法界之至微者并地獄法界共為十種世間有情類盡色心則總舉依正乃成五陰單色無心乃成國土如是十界三千皆須六即辨其初後是則舉十界依正二報凡是性具一色一心皆可以六即判之所謂下二的判文中但拈界及微者如畜生道中順足以丸其糞倒足以推其車者皆可以六即判之故曰所謂理蛣𧏙云云何以故以論十界皆理性故無非法界一不可改言性具十界無不即性體性量清淨本然周徧法界也故名字去結成六即之義不專在佛之意此段文總證初心是方有後心是也次釋後心是方顯初心是云何後心是方顯初心是正由後心果地全證眾生理本故果地七種名目悉是眾生性德美稱但眾生在迷性德不顯故無此稱尅論性德豈可言無眾生理具諸佛果成二二相成方為圓道葢後非初不有初非後不彰今文釋成後義故曰正由後心果地全證眾生理本苟初心不具七種美稱果地云何得證如是功德但眾生下釋疑可知次結故初後俱善立義成矣夫疑為信障亦是悟門如前疑難苟蘊之在懷豈不為性具法門之信障今陳疑決答羣疑冰泮豈不為生即無生之悟門故凡造論必設問答以發明之庶疑無不決信無不生此立辨難闡明奧旨力重千鈞學者疑深翫之次一門明事造方融者對前科而言以由眾生理性本具故今事造方融也然論本意明求生淨土在於事造而此事造法體本融乃生本無生但事造屬末理具屬本本非末不顯末非本不融二二相成為論本意故科之云事造方融文分為二初標二身土緣起門緣者因緣也起者生起也因緣為能生身土為所生中論所謂因緣所生法是也以論為門義如前釋次釋二初述偈立宗一真法界性不變能隨緣三身及四土悉由心變造一真法界性言其體也不變能隨緣言其能也三身及四土言隨緣所造之事也悉由心變造者會事歸理會所歸能也變造之名出華嚴楞伽二經四明尊者云造通四教變惟屬圓義兼於別分但不但但中佛性如純善人不能作惡為惡人逼強作諸惡性變為惡不但中如君子不器善惡皆能雖同惡人作諸惡事其性不變今文既云不變能隨緣正以圓中而為佛性次依宗釋義二初通明諸法二的明此宗初中二初明不變隨緣二明隨緣不變初又三初釋第一句以立根本論曰一真法界性即前文所明性體性量性具也一真法界性體性量性具本也性也理也體也所造三身四土末也相也事也用也體微用不彰用微體不立論欲明身土之用苟不先指一性理體以為根本則用無所立義無所歸故先釋第一句以為根本次釋第二句顯前功德三初法教中說真如不變隨緣隨緣不變者正由性體性量即性具故教中者汎舉經論也若欲的指起信論雖彰其名不若楞嚴經盛闡其義如七大莫不清淨本然周徧法界此言不變也而一一皆云隨眾生心應所知量循業發現此言隨緣也既言清淨本然而隨緣豈非能隨其緣而不變正由性體性量即性具亦唯此文渙彰其義如曰性色真空性空真色等非性具乎又曰一一清淨本然非性體乎又曰周徧法界非性量乎前文已明今不繁釋次譬如君子不器善惡皆能君子不器語出論語朱子曰器者各適其用而不能相通成德之士體無不具故用無不周非特為一才一藝而已論引以譬一真法性之中體無不具故能隨淨緣能造佛界之善隨染緣能造九界之惡也三證二初引經故晉譯華嚴經云能隨染淨緣具造十法界華嚴有二譯一晉譯二唐譯天台大師生於梁代而說法於陳隋故凡引證皆是晉譯今仍大師所用故引晉譯次釋義二初釋隨緣變造謂真如性中所具九法界能隨染緣造事中九法界真如性中所具佛法界能隨淨緣造事中佛法界夫性有善惡緣有染淨性具佛界為善全性起三觀之修為淨性具九界為惡全性起三惑之修為染緣雖染淨不同能從善惡而起善惡之性在真如中其體融通皆不分而分分而不分者也或問九界之中六凡見思可云為染三乘本修空觀菩薩本修假中二觀云何亦判為染答曰二乘修空雖異六凡其所修者正順塵沙菩薩假中雖異二乘其所修者正順無明是以九界槩判惑染以其不知修從性起逆三德性故也惟圓頓教初心即知全三惑染是三德性能全性起修是故若空若假若中皆稱為順為淨也次釋能生所以二初釋所以能者正由性具性若不具何所稱能圓頓教人妙解妙行及所重者華嚴能之一字非惟隨淨緣造修善謂之為能即隨染緣造修惡亦謂之能染淨雖復差殊能性無二無別既無二別是則本無染淨之分今秪就眾生迷情謂之為染諸佛悟理謂之為淨爾然而歸功有在正由性具性若不具何所稱能次證天台家言並由理具方有事用此之謂也天台家言者荊溪大師十不二門中文也引證華嚴能隨之文有三義曰理具曰事造曰二緣今文但證二意已含三三釋三四句結成所由是知事中十法界三身四土悉由真如隨緣變造事中十法界總約生佛依正而言三身則別約佛界而言乃略土而存身四土則通約十法界而言乃略身而存土葢三身則惟佛有之菩薩雖具終未究竟四土則佛界具有菩薩有三二乘有二六凡惟一即同居土也如是十界身之與土悉由真如一性理具三千隨染淨緣變造三千初明不變隨緣竟次明隨緣不變二初釋既曰真如不變隨緣隨緣不變則事中染淨身土當體即真無一絲毫可加損於其間者若別教但中之理既變而方隨緣安得隨緣而能不變此如淳善人本不能惡為惡人逼而強作諸惡故說此善人今不淳矣今圓教圓中性具諸法乃真如既不變而隨緣豈不雖隨緣而不變惟其不變故事中不惟清淨身土當體即真即染汙身土亦當體即真是則於淨身土無一毫而加於性於染身土無一毫而損其真次證楞嚴經云見與見緣并所想相如虗空華本無所有此見及緣元是菩提妙淨明體是也不變隨緣之義有理實有情虗九法界眾生迷理實以為情虗故隨緣變造九界依之與正佛法界人達情虗而為理實故隨緣變造佛法界依之與正如見與見緣并所想相以情虗故本無所有而眾生迷之以為實有惟十方諸佛與大菩薩於其自住三摩地中達情本虗故如虗空華本無所有情虗既去而理實自現故此見及緣元是菩提妙淨明體云何於中有是非是以此文而印證此理最為允當初通明諸法竟次的明此宗二初發明宗義二結歸顯旨初又二初明不變隨緣若然則娑婆極樂此世眾生當生九品彌陀已成吾心當果悉由心性之所變造不變隨緣隨緣不變之義既成今乃會而歸之以明今宗求生極樂之事莫非不變而隨緣文中先舉隨緣之事約土則有此彼之殊故曰娑婆極樂約因則有現未之異故曰此世眾生當生九品約果則有己他之別故曰彌陀已成吾心當果然後略點不變之旨故曰悉由心性之所變造要知隨緣之事悉由真如變造而已立此以為根本可以發明隨緣不變之義次明隨緣之變心具而造豈分能所即心是佛即佛是心即心是土即土是心即心是果即果是心能造因緣及所造法當處皆是心性心具而造豈分能所二句立根本泯能所忘待對也葢約事雖有彼此現未己他之殊約理實無身土因果生佛之異是則即心是佛二句泯因果也次二句泯彼此也次二句泯現未也皆以心性泯之俾因果混為一致彼此融為一體現未會為一家何以故能造因緣及所造法當處皆是心性故也次結歸顯旨故明此宗而求生樂土者乃生與無生兩冥之至道也明此宗者悟隨緣不變無生之理也求生樂土者熾然求生淨土不變隨緣之事也不變隨緣不妨無生而生隨緣不變不妨生而無生生而無生則冥其生無生而生則冥無生合而言之豈非生與無生兩冥之至道乎次八門明枝流妙即二初二門明所生身土次六門明能生因果初二明所生身土二初一門約依報論妙二初標三心土相即門此門以心土遠近為離以性無遠近為即心即是性土不外心乃會心土為一致融心性為一體以了乎生即無生無生而生也次釋二初述偈立宗西方安樂土去此十萬億與我介爾心初無彼此異初二句言其遠也次二句言其近也兩者合而言之葢是示其即遠而近即近而遠以明其非遠非近論功行一生可也經年可也七日可也十念可也一念可也論往生則壯士屈伸臂頃可到也諸佛彈指聲中可到也以其非遠非近忘能忘所故次依宗釋義二初釋初二句明遠三初引經論曰佛說阿彌陀經云從是西方過十萬億佛土有世界名曰極樂經云從是者自娑婆世界中南閻浮提舍衛國祇樹給孤獨園之西而去如是盡一娑婆百億日月百億須彌百億四大部洲謂之一世界世謂遷流有日月歲時三世變易界謂方位有東西南北十方疆界從此西去凡過十萬億三千大千世界方有世界名曰極樂言彼國土無寒暑推遷直登不退則無生死苦矣無五欲塵勞心得自在則無煩惱苦矣耳聞目見根根塵塵無非妙法惟是念佛念法念僧則無業繫苦矣眾生生者皆正定聚得不退轉諸世界中樂之至者故名極樂種種樂事不能枚引具如大彌陀經十六觀等經中說次釋數百億日月百億須彌百億大海百億鐵圍山名一佛土十千為萬十萬為億百億日月者俱舍頌云四大洲日月蘇迷盧欲天梵世各一千名一小千界此小千千倍說名一中千此千倍大千皆同一成壞以此百億日月等為一佛土如是從此凡過十萬億三千大千世界方名為極樂世界三結成一佛國土已自廣大況億佛國土乎況十萬億乎是則極樂國土去此甚遠先以一佛國土況億佛國土次以億佛國土況十萬億佛土以此而言極樂世界去此娑婆豈不甚遠次釋後二句不遠二初正釋次料簡初又三初明不遠之由博地凡夫念佛求生彈指即到者正由生吾心所具之佛土也博大也凡眾也夫者人也古者人長一丈稱為丈夫詩甫田注疏夫者輔相之德而可倚仗謂之丈夫今通指大地或悠悠凡夫或四教未破惑位外凡之人既無道力可憑又無神足可恃然但一心念佛或暫或久求生極樂而臨命終時彈指即到者正由人心性中本具極樂佛界之依報即性體而清淨本然即性量而周徧法界以極樂在吾心內近近之一隅豈足以為遠哉次明心之相狀言介爾心者即凡夫念佛之心也剎那之心至微至劣故稱介爾介爾者即剎那初起至促之念毗曇云百二十剎那為一怛剎那此名一瞬六十瞬為一息仁王云一剎那有九十生滅是則介爾者至促至速至微至劣三明心土相即謂十萬億遠之佛土居於凡夫介爾之心即心是土即土是心故曰初無彼此異十萬億土言其遠也大也介爾妄心言其近也小也即心是土則小者近者之心而即是極遠極大之佛土即土是心則大者遠者之佛土即是最促最劣之妄心有何彼此異哉次料簡二初以小不包遠問曰介爾之心居於方寸云何能包許遠佛土此以凡夫性相不融真妄未會之疑情而難於性相不二真妄無差之妙論如此之疑非獨初心未入佛教者有之即久在釋門拘於一墟束於一教作人天師者亦復有之苟不精於天台之教鮮不生乎疑謗者也次依真妄不二釋三初法二初略明答曰介爾之心昧者謂小達人大觀真妄無二迷者昧性而執相故以念為小為近極樂為大為遠悟者即相而觀性不以念為小為近亦不以土為大為遠達其本如故真妄無二次釋成蓋此妄心全性而起性既無邊心亦無際所以真妄無二者何也蓋此妄心乃全性而起能起之性既自無邊所起之念豈有涯際次譬性如大海心似浮漚全海為漚漚還匝海楞嚴經兩處出海漚喻第二卷云譬如澄清百千大海棄之惟認一浮漚體目為全潮窮盡瀛渤乃喻眾生認妄為真非此中喻意也第六卷空生大覺中如海一漚發乃喻真覺大空世界三者展轉相比小之又小亦非此中喻意也今初二句且以海大漚小以喻性大念小次二句方融通之全海為漚喻全性為念漚還匝海喻全念是性性既無邊念豈有際乎三合二初正合蓋真如不變隨緣隨緣不變不變隨緣乃全性以為念喻全海為漚隨緣不變乃全念而是性喻全漚匝海次結責既曰隨緣不變豈可以真妄而局大小哉前文雖用從本起末會末即本而正意在第二句故今結責但用隨緣不變葢設若隨緣而體變則可以真妄而局大小既不如是則心土相即之宗成矣釋義序問橋佛祖建立種種法門以濟度人猶如橋梁眾生但當依之而修不當於能詮言教上而計其辭之巧拙也猶如行路逢橋不履而行徒問何為但欲究其橋之來歷未免稽留道路不能前進故方等陀羅尼經第三卷有問橋之喻具如彼明論記聲聞僧問曰此等諸師亦大菩薩云何以聲聞稱之答曰此中且以傳持佛法現聲聞相故以佛道聲令一切聞故三因五佛性眾生各有本具之理為正因本具之智為了因本具之行為緣因五佛性者如上三因佛性更加二轉依果所謂菩提為果性涅槃為果果性是也佛具四土菩薩三土問曰若別地圓住以上分證寂光亦應具四土若未登住地僅斷見思亦止二土云何菩薩具三土耶答曰寂光一土有與奪二義與之則住地以上皆名分證寂光奪之則等覺以還僅名報土所謂三賢十聖住果報唯佛一人居淨土是也此中是約奪義故曰三土見與見緣并所想相見是八識見分見緣是八識相分見相二分皆依他起性所想相者此不了依他而起徧計正定聚聚者類也定以決定為義一切眾生凡有三類不同必入涅槃能破顛倒名正定聚必入惡趣不能破倒名邪定聚得因緣能破不得不能名不定聚
