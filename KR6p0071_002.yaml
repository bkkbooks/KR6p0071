body:
  text: 幽溪法孫受教記次一門約正報論妙二初標四生佛不二門此門以迷悟為二心性為不二即心性而為迷悟則不二而二即迷悟而是心性即二而不二令知從本以為末循末而返本也次釋二初述偈立宗阿彌與凡夫迷悟雖有殊佛心衆生心究竟無有二阿彌果人厥位居悟凡夫因人厥位居迷迷悟雖復差殊心性云何有二次依宗釋義二初釋初二句約相明不二而二初正明二初明彌陀悟相論曰阿彌陀佛者果人也成就三身四智十力四無所畏十八不共等功德三身者法報應也本覺滿成法身始覺滿成報身始本一合始本俱忘能起大用成應身四智者一大圓鏡智謂如來真智本性清淨離諸塵染洞徹內外無幽不燭如大圓鏡洞照萬物無不明了二平等性智謂如來觀一切法與諸衆生皆悉平等以大慈悲隨其根機示現開導令其證入三妙觀察智謂如來善能觀察諸法圓融次第復知衆生根性樂欲以無礙辨才説諸妙法令其開悟獲大安樂四成所作智謂如來為欲利樂諸衆生故普於十方世界示現種種神通變化引諸衆生令入聖道成本願力所應作事十力者一處非處力知一切因緣果報定相從如是因緣生如是果報悉皆知之二業智力知一切衆生過現未來諸業諸受三定力知一切諸禪三昧四根力知他衆生諸根上中下品五欲力知他衆生種種樂欲六性力知世間種種性七至處力知一切道至處相八宿命力知一世乃至無量世中姓名苦樂壽命長短等九天眼力見衆生生時死時善道惡道等十漏盡力自知我生已盡不受後有知諸衆生各各以何等因緣得涅槃四無所畏者一一切智無畏二漏盡無畏三説障道無畏四説苦盡道無畏於大衆中廣説自他智斷既決定無所失則無恐懼之相也十八不共法者一身無失二口無失三意無失四無不定心五無異想心六無不知已捨七欲無減八念無減九精進無減十智慧無減十一解脫無減十二解脫知見無減十三一切身業隨智慧行十四一切口業隨智慧行十五一切意業隨智慧行十六知過去無礙十七知現在無礙十八知未來無礙凡是諸佛皆有如是悟相今則指彌陀悟相不外如是功德次明衆生迷相凡夫者因人也具足無量恆沙煩惱造作無量恆沙業繫當受無量恆沙生死煩惱者惑道也亦名煩惱障略則三惑業繫者業道也亦名業障略則十善十惡生死者苦道也亦名報障略則分段變易二種生死皆云無量恆沙從廣而言也次約譬結迷悟之相譬如雲泥佛法之高如雲在天衆生之下如泥在地迷悟之相自殊高下之位成異次釋次二句約性二而不二初通明不二二釋成此宗初又五初性相對顯言究竟不二者謂據相而言則不二而二約性而論則二而不二據相而言如上所明是則迷悟天淵宛爾成二約性而言如下所明是則生佛體同昭然不二若果二也云何能融歸不二果不二也云何能岐之為二要知二者乃全本而為末如全水為波不二之二也不二者乃全末而為本如全波為水二而不二也本末因依體用交互二而不二不乏旨歸二展轉釋成本科既云展轉釋成不須更引他文來釋二初約迷悟釋成蓋諸佛乃悟衆生心內諸佛衆生乃迷諸佛心內衆生生之與佛不二而二心之與性二而不二蓋約能造所造言之乃全不二者以為二結能具所具言之乃全二者以為不二次約三德釋成所以悟者悟衆生本具性體性量性具也所以迷者迷諸佛所證性體性量性具也只一性體性量性具隨其迷悟不同以成二種差別自其迷悟而觀不容不異自其三德而觀不容不同中間自有不隨其迷悟差別者存焉所謂心性是也三直據心性心性之妙豈受其迷迷而不迷斯言有在心性之妙者即衆生介爾一念之心具足百界千如而此心性即性體之清淨無染體性堅凝即性量之竪窮橫亘周遍法界心性之妙若此隨緣不變豈受其迷然而衆生現居其迷乃迷而不迷有在者在乎三德也四會合三身故衆生本有性體即諸佛所證法身性量即報身性具即應身四智十力四無所畏十八不共等功德會合可知諸佛果上有二轉依號所謂轉煩惱依菩提轉生死依涅槃皆名轉而體不轉今此亦然乃轉三性以為三身又此三性在迷謂之三道性體在迷謂之苦道在悟乃轉苦道而為法身永嘉所謂幻化空身即法身是也性量在迷謂之惑道在悟謂之報身亦名般若永嘉所謂無明實性即佛性是也性具在迷謂之業道在悟轉為應身亦名解脫天台所謂功德和法身處處應現往是也四智等會合可知者一往且以四智屬般若性量報身十力等屬解脫性具應身五引果德證故古德云諸佛心內衆生塵塵極樂衆生心內諸佛念念證真古德云者此本天台成語而楊次公十疑論序用之此二句文其義甚博其意甚深關係三性不得草草一約彌陀性具言之既備十界則娑婆衆生者乃彌陀諸佛心內究竟之衆生然悟則俱悟不惟本具佛界成悟即本具九法界衆生亦復成悟佛居常寂光土則所具九界依報亦塵塵無非極樂也又約衆生性具言之亦既備十界則極樂彌陀者乃我衆生心內所具之諸佛雖迷則俱迷而所具佛界不受其迷豈非衆生心內諸佛念念常證真乎言念念者正一念具足三千之意也二約性體言之彌陀即性具之性體既清淨本然此性體即性具衆生之依報豈不塵塵皆極樂乎又約衆生即性具之性體既清淨本然況所具佛界原自本然豈不衆生心內諸佛念念常證真乎三約性量言之彌陀即性具之性量既遍周法界處處寂光則衆生者諸佛心內衆生豈不亦塵塵極樂乎又約衆生即性具之性量亦既遍周法界圓裹諸佛法身豈不衆生心內諸佛念念證真乎此更約己心生佛他心生佛以明之荊溪大師所謂他心生佛尚與心同況己心生佛寧乖一念是也次釋成此宗二初生佛相即故彌陀即我心我心即彌陀彌陀即我心者釋成衆生心內諸佛念念證真我心即彌陀者釋成諸佛心內衆生塵塵極樂次出其功能功能者言衆生心性有凡心即佛心己心即他心之力用亦凡心即佛身佛土己心即他身他土之力用也未舉念時早已成就才舉心念即便圓成感應道交為有此理故念佛人功不唐捐初二句以性奪修謂雖未念佛而我性中早已具足次二句以修成性謂全性起修之妙無論久修即才舉一聲佛號即得往生第三二句明修性契合成感應事此中感應與觀經不同彼明修觀境歷十六修涉觀行相似分真此明至理微妙即火車相現一念改悔十念成就者即蒙接引而得往生以為感應道交云道交者如磁石吸針有天性相關之道不期然而法爾如然者也四二句明但凡深信念佛發願求生者功無虗棄也此文八句有展轉生起結歸之勢者三一生起之勢者以有未舉念時早已成就之理故有才舉心念即便圓成之修以有上文修性一合之義方有感應相交之道以有感應不無之義故有念佛人功不唐捐之效二結歸之勢者功不虗棄之效為有感應相交之道感應相交之道為有舉念圓成之修舉念圓成之修為有未舉念時早已成就之理次六門明能生因果二初三門約因論妙次三門約果論妙初三門約因論妙又三初一門明全理起事次一門明事事無礙次一門明三觀圓融初中二初標五法界為念門法界者約性而言為念者約修而言今合二者而言故云法界為念則全性而起修也次釋二初述偈立宗法界圓融體作我一念心故我念佛心全體是法界初二句明全性以起修次二句明全修而在性謂全法界圓融之性體作我一念之用修故全一念之用修當體是圓融法界之性體也次依宗釋義二初通明理事二釋成此宗初中三初明事中諸念論曰行者稱佛名時作佛觀時作主伴依正餘觀時修三種淨業時一心不亂時散心稱名時以至見思浩浩恆沙煩惱此歷明諸念其中有事修有理觀有事理兼修有順修逆修約相雖有差殊約性元歸不二稱佛名時者如觀經下品下生中云或有衆生作不善業五逆十惡具諸不善如此愚人以惡業故應墮惡道經歷多劫受苦無窮如此愚人臨命終時遇善知識種種安慰為説妙法教令念佛彼人苦逼不遑念佛善友告言汝若不能念彼佛者應稱無量壽佛如是至心令聲不絶具足十念稱南無阿彌陀佛名故於念念中除八十億劫生死之罪命終之時見金蓮華猶如日輪往其人前如一念頃即得往生極樂世界於蓮華中滿十二大劫蓮華方開觀世音大勢至以大悲音聲為其廣説諸法實相除滅罪法聞已歡喜應時即發菩提之心是名下品下生者是名下輩生想名第十六觀次明事全是理凡此有心皆由真如不變隨緣而作全體即是法界凡此有心者牒前諸念皆全真如不變之理以為念佛等逆順隨緣之事故全逆順隨緣之事即是真如不變之理三證全理論事故法智大師云法界圓融不思議體作我一念之心亦復舉體作生作佛作依作正妙宗鈔釋大師疏此經心觀為宗實相為體竟復示之以圓頓宗旨云又復應知法界圓融不思議體作我一念之心亦復舉體作生作佛作依作正作根作塵一心一塵至一極微無非法界全體而作既一一法全法界作故趣舉一法即是圓融法界全分既全法界有何一物不具諸法此是法智大師深悟圓乘之大宗旨若非吾祖幽溪大師以不變隨緣隨緣不變之旨而闡明之則法智大師此旨不易知也是祖祖之心宗天台之妙旨讀是論者請事此語其不然者則孤吾祖與法智大師之心也次釋成此宗五初舉劣況勝若然者餘心尚是況念佛心乎若然者承上之辭若以性而觀之則餘心非劣念佛非勝平等不二今以相而觀之故以餘心之劣而況念佛之勝餘心逆修見思浩浩尚即法界況復順修念佛般若明明非法界乎次指示即理是故行者念佛之時此心便是圓融清淨寶覺念佛之時心是寶覺者妙宗所謂以我具佛之心觀彼即心之佛佛既即心有何一念非圓融寶覺乎此乃約性法爾如斯三出其功能以此妙心念彼阿彌則彼三身何身不念求彼四土何土不生此中功能須約兩意通之其義方顯先約修成以彰其義次約性具以顯其功先約修成以彰其義者有次第圓融二義次第義者要以空觀觀佛應身伏見思方生同居淨土空觀破見思方生方便淨土假觀觀佛報身破盡塵沙中觀觀佛法身分破無明方生實報淨土亦是下品寂光中觀觀佛法身破盡無明方生究竟寂光淨土此約次第説也若圓融者三觀一心中修三身一心中念三惑一心中破四土一時而生所謂舉一即三言三即一也次約性具以顯其功者又有橫竪二義橫則單約性具如觀一念心具足十界則本具六凡是念佛應身生同居淨土又本具二乘是念佛應身生方便淨土本具菩薩佛界是念佛報法二身生實報寂光二種淨土竪則約觀性具十界是念佛應身生同居淨土觀性量是念佛報身生方便淨土觀性體是念佛法身生實報寂光二種淨土如是則己他之三身四土皆我性具即性體性量無不具足能以此妙心全性起修則何身而不念何土而不生乎又復應知非曰能以三觀觀之方契三身無有三觀逈然不是雖然即是不知成迷圓人妙觀全在了達故凡有觀行悉稱無作四約位釋妨但隨功行淺深品位高下耳上文所説全約理即若不約後之五即判其地位則令學者有增上慢之失故寄釋學者之疑云若三身四土本來具足則佛不必念觀不必修故釋之曰理雖具足奈惑有淺深位有高下豈得一向不尚修耶五問答決疑問餘心是法界何必念佛答餘心是而逆念佛是而順以順翻逆故須念佛非法界有異也舊本脫此一科今依別本補出次一門明事事無礙二初標六境觀相吞門境為所觀觀為能觀二字法門攝行門盡如佛説觀無量壽佛經觀之一字為能觀觀無量壽佛為所觀境經明十六觀觀觀如此至於楞嚴二十五門圓覺二十五輪莫非境之與觀是則外境觀而別事他修如蒸砂作飯縱經塵劫止名熱砂終不是飯次釋二初述偈立宗十六等諸境事理兩種觀彼此互相吞如因陀羅網十六觀者初依報有六一日二水三地四樹五池六總二正報有七七華座八像九佛身十觀音十一勢至十二普十三雜十四十五十六三輩往生事理二觀者但觀十六境為事以三觀觀十六境為理相吞之義具在下文次依宗釋義二初先明偈意二釋成此宗初中二初牒三句以立理本二初出相吞之由論曰境觀相吞者正由事事無礙也事事無礙者杜順和尚華嚴法界觀云法界者一切衆生身心之本體也法者軌則也界有性分二義若約事説界即是分義謂隨事分別故也若約理説界即是性義謂諸法性不能變易故也以此性分互相交絡則成理事無礙法界以理融事一一融通則成事事無礙法界也一事法界謂諸衆生色心等法一一差別各有分齊故名事法界分齊者限量也二理法界謂衆生色心等法雖有差別而同一體故名理法界三理事無礙法界謂理由事顯事攬理成理事互融故名理事無礙法界四事事無礙法界謂一切分齊事法稱性融通一多相即大小互融重重無盡故名事事無礙法界今境觀相吞同彼第四仍論性具稍異於彼次出無礙之本二初旁引事事所以無礙者所謂有本者如是也有本如是文出孟子彼云原泉混混不舍晝夜盈科而後進放乎四海有本者如是今借泉源為水之本以喻事事無礙本于法界圓融次正釋蓋由法界圓融不思議體作我一念之心亦復舉體作生作佛作依作正既皆全體而作有何一法不即法界故曰一塵法界不小剎海法界不大多亦法界少亦法界法界圓融不思議體者性具即性體性量真如不變之體也作我一念之心等者隨緣之用也舉體者全真如不變之體以造隨緣種種之用也既皆全體而作即有本者如是也有何一法不即法界正明相吞之相也云何相吞秪由一塵法界不小剎海法界不大多亦法界少亦法界也下以因陀羅網釋出其義逾明次釋諸句正明相吞三初釋一二句境觀有本是以西方十六諸境吾心事理二觀一一無非法界全體十六境觀從末而言無非法界自本而説本非末不彰末非本不妙本末相依方成妙觀次釋第四句譬喻圓融如帝釋宮中因陀羅網雖彼此各是一珠而影入衆珠雖影入衆珠而東西照用有別如帝釋宮下先舉譬本雖彼此下次出譬相各是一珠喻十六諸境事理二觀影入衆珠喻真如法界境觀相吞雖彼此各是一珠而影入衆珠喻所具三千之法在一性中而派之常合雖影入衆珠而東西照用有別喻百界之理在一念中而會之彌分三釋第三句事理互吞境觀亦然以境為事則觀為理理能包事是為以觀吞境以觀為事則境為理理能包事是為以境吞觀若觀若境或一為事餘為理或一為理餘為事彼此互各相吞故如因陀羅網初以境為事觀為理次以觀為事境為理者此約具造二説方盡其旨一約具説者如一念中具足三千則一念無差者為理三千差別者為事次約造説者如一念乃根塵相對方能現起乃屬於事三千性具乃屬於理又此三千彼彼互具以能具者為理所具者為事餘法亦然又以性具為事以即性體性量為理三不相雜故各各皆為理事是則理則俱理事則俱事今事理各分而互説者乃約當情以分主賓故也如以境為事則為賓以觀為理則為主主能攝賓賓來歸主故理能包事是為以觀吞境餘法亦然是則境之與觀一一可以互為賓主一為事餘為理亦如是説乃彼此互各相吞法喻相齊義也次釋成此宗二初正明若然者當我作觀時則西方依正已在我觀之內我今身心已在依正之中西方依正在我觀內此以觀吞境也我今身心在依正中以境吞觀也此正顯一切事法稱性融通一多相即大小互容重重無盡既有是性必有是相既有是因必有是果依正已在我觀之內如今已見不待將來方見身心已在依正之中于今已生不待將來方生唯心淨土本性彌陀之旨談至此可謂妙絶古今矣次引證了此而求生安養可謂鴈過長空影沉寒水鴈絶遺蹤之意水無流影之心了此者言圓人用圓解以修圓行也境觀大率相同唯了與不了有異惟圓人能了此事事無礙之理一一莫不稱性而修絶待而照鴈過長空用天衣懷禪師語師雖禪宗大老居常密修淨土一日室中問學者云若言捨穢取淨厭此欣彼則是取捨之情衆生妄想若言無淨土則違佛語修淨土者當如何修衆無語復自答云生則決定生去則實不去又云譬如鴈過長空影沉寒水鴈絶遺蹤之意水無留影之心今先釋彼義後會本文鴈過長空影沉寒水者喻生則決定生鴈絶遺蹤之意水無留影之心者喻去則實不去也蓋十方是當人一箇清淨法身有何去來之相故去則實不去然約妙報而言生因未盡者不妨舍此生彼成辦大事故生則決定生然即法身而為妙報不妨無生而生即妙報而是法身不妨生而無生此則終日取捨而無取捨存焉亡焉不可得而名焉後會本文者境觀各各受吞即生則決定生也各各相吞即去則實不去也生而無生生化兩冥生無生論義歸乎此次一門明三觀圓融二初標七三觀法爾門法爾者法性自爾天然自然不假勉強也荊溪大師云三諦者天然之性德也以此三觀全三諦起諦觀名別體復同故也前第五法界為念但明全性起修第六境觀相吞兼言境觀於觀雖分事理不知理是何觀今則明指一心三觀以為理觀從疏洎親無相混濫次釋二初述偈立宗能觀為三觀所觀即三諦全性以起修故稱為法爾只此三因義稱三法所謂空性了因假性緣因中性正因如是三法約所觀即為三諦約能觀即為三觀原是一體不分而分次依宗釋義二初通明諦觀二釋成此宗初中二初牒前諦觀論曰三諦者真俗中也三觀者空假中也天台所立三諦三觀雜出仁王瓔珞大論圓覺楞嚴或名義並明或義顯名隱皆佛祖之心宗含生之妙性後代弘宗者或晦名而獨闡其義如掩耳以竊鈴其有志於佛乘者請究心於茲庶無留滯不遭岐路次別明諦觀二初明三諦二明三觀初又三初明三諦功能忘情絶解莫尚乎真隨緣應用莫尚乎俗融通空有莫尚乎中荊溪大師云真諦者泯一切法泯一切法者九界之情佛界之解纖塵不立故曰忘情絶解莫尚乎真又曰俗諦者立一切法立一切法者佛界之應九界之用無法不彰故曰隨緣應用莫尚乎俗又云中諦者統一切法統一切法者真諦十界之空俗諦三千之有無不融之通之既雙遮而不立亦雙照而昭然三諦具乎一心三義總于一念則無情不遣無理不彰也故曰融通空有莫尚乎中次明三諦相貌虗靈不昧此吾心自空者也物來斯應此吾心自有者也空有相即此吾心自中者也論明三諦不外當人一念如日月之間根塵相對凡有所念本自空洞推檢此心了無一物而亦昭昭靈靈纖毫不昧非吾心自空者乎至根塵敵對遇染淨緣十界心起物來斯應非吾心自有者乎然空亦此念有亦此念即空復即有即假又即真融通二邊雙遮雙照非吾心自中者乎求於一心既如此求於萬法亦如此是則三諦者本自天然心佛及衆生是三無差別皆可即事而求也三結諦非是觀此性也非修也三諦也非三觀也三諦者真如不變能造之妙性也三惑者隨染緣所造之逆修也三觀者隨淨緣所造之順修也性雖本妙隨染成逆故云見思阻乎空寂塵沙障乎化導無明翳乎法性破茲三惑非三觀莫克故曰破一切惑莫尚乎空立一切法莫尚乎假統一切法莫尚乎中欲復性以破惑須全性以起修諦觀名別體復同是故能所二非二皆荊溪之格言天台之要旨也次明三觀二初標本修之者稱性照了也天台三觀名為無作妙行者以其不假作為稱性照了三諦之性照性成修次釋成二初別論二總論初中二初釋次結初又二初次第故體達此心空洞無物謂之空照了此性具足萬法謂之假融通二邊不一不異謂之中心本空洞昏昏擾擾謂之見思性本具足一向迷昧謂之塵沙體本融通妄分一異謂之無明今則反是因空洞而體達之隨性具而照了之順空有而融通之肇公亦云聖遠乎哉體之則神道遠乎哉觸事而真欲修三觀者當以此語為神鑑可也次圓融三初重指三諦圓融然則即虗靈而應物也即應物而虗靈也然則者非承上次第之言乃遠討三諦之本以上文明相貌中三諦皆指吾心之相其相雖有差殊一心豈存別異蓋即此心虗靈者而應物真諦已即俗矣即此心應物者而虗靈俗諦已即真矣真即俗則照俗而遮真俗即真則照真而遮俗三諦圓具何有次第也次正釋三觀相即空即假中也假即空中也中即空假也上明三諦既其圓融今明三觀故亦相即即虗靈而應物故空即假也即應物而虗靈故假即空也即二邊而融通故空假即中中即空假也三讚美三觀微妙是稱性而修也絶待而照也不思議之三觀也首楞大定之司南也全三諦之性以起三觀之修故是稱性而修諦觀俱在一心一心豈分能所故是絶待而照妙宗云諦既即一而三觀豈前後而照故於妙境以立觀門即於一心而修三觀此觀觀法能所雙絶待對斯亡此之謂也不思議之三觀者若空不即假中假不即空中中不即空假離此而修修外有性皆可思議之法也今既異此故不思議首楞大定之司南者泛舉其法則凡是依此而修即名健相分別通號首楞大定乃是成佛指南乃即大定為指南非曰修大定者別有指南若指其文則大佛頂經首楞嚴定當機首請三法如來開以圓解然後依解修觀依行證果莫非闡揚此旨次結此別論也如此別論者境觀各三在能在所故名為別下文總論則束三觀而總為能觀之空束三諦而總為所觀之假束心境而泯忘之總謂之中次總論二初次第若總論者或以吾心虗靈者為空以所觀萬物者為假以心境不二者為中此中所説次第乃以不次第而為其次如三法本具一性諦觀同居一心尚何次第之有然隨人用之不無賓主今初以能觀之空而為其主則假中為賓賓隱而主立故以吾心虗靈者為空次以所觀之假為主則空中為賓亦主立而賓隱故以所觀萬物者為假三以合能所者為主則空假為賓亦賓隱而主立故以心境不二者為中次圓融物吾心之物也何假而不空心萬物之心也何空而不假即心即物即物即心何中而不空假觀以心為空以物為有以心物相即為中初句即物而心次句即心而物三句心物互即以成圓融三觀依文解釋如此貴在得乎意本意本者在前一真法界門中所説性具即性體性量蓋心之與物俱有不變隨緣隨緣不變二義苟非性具即體量何以見此三觀之指南故心有真如不變之心隨緣所造之心物有真如性中之物隨緣變造之物真如之心即一真法界中所明清淨本然周遍法界者也隨緣所造之心即心土相即門根塵相對介爾一念妄心也真如性中之物即一真法界門所明性具十界也隨緣變造之物即心土相即門所明此土西方所造依正二報以有真如根本能具所具故有今日隨緣變造之心即此妄心復有所具所造之物今此文中所明之物且約一念性具之物至下釋成此宗中所觀極樂依正乃此心所造之物苟不知此何能消二處之文耶次釋成此中二初明總別自在是以觀極樂依正者以吾心一觀之三觀照彼一境之三諦無不可者以吾心三觀之一心照彼三諦之一境亦無不可者前文所明皆即心觀佛以為假觀今則托境修觀以為事境乃今論之正意即妙宗鈔中所謂據乎心性觀彼依正依正易彰託彼依正觀於心性心性易發是也以吾心一觀之三觀照彼一境之三諦者心本是一豈非只是一觀然而不妨一中具三境本是一豈非只是一境然亦不妨一中具三此為以一心三觀觀一境三諦此出於尋常者也若夫以吾心三觀之一心照彼三諦之一境此則異乎尋常乃以三觀一心者束之為空三諦一境者束之為假境觀合一者束之為中使人易可修造可謂得山教之心宗契如來之命脈者也次證圓融三觀虎溪大師云境為妙假觀為空境觀雙忘即是中忘照何嘗有先後一心融絶了無蹤尚何三觀之不法爾乎境為妙假者有門頌所謂不思議假非偏假乃以三諦一境而為妙假觀為空者所謂真空不空非但空乃以三觀一心而為空觀境觀雙忘即是中所謂圓中圓滿非但中乃以三境三觀即心性絶待者為中觀忘照何嘗有先後者空假二觀雙照也中道妙觀雙忘也即空假而中即中而空假忘之照之總在一心有何次第前後故曰一心融絶了無縱言無縱者忘之照之俱泯俱絶故無有縱末句結成法爾謂能如此了如此修無作妙觀天然而然無所往而非是也次三門約果論妙二初一門明生佛道交次二門明時處不隔初中二初標八感應任運門衆生稱名念佛為感諸佛接引往生為應佛與衆生天性相關自然而然故曰任運次釋二初述偈立宗我心感諸佛彌陀即懸應天性自相關如磁石吸針初句明感次句明應三句明感應之妙四句約喻以顯次依宗釋義二初通明生佛二釋成此宗初中二初明天性二明感應初又二初明生佛同源二初正明論曰諸佛衆生同一覺源迷悟雖殊理常平等初二句明生佛之理本第三句明升沉之事相據事相不得不異據理性不得不同若曰即理本為事相全事相為理本雖差別而無差別故曰迷悟雖殊理常平等次引證故曰諸佛是衆生心內諸佛衆生是諸佛心內衆生具約三性而釋方盡其理如前已明次明心精通㳷迹此而言則諸佛衆生心精無時而不通㳷楞嚴經云心精通㳷當處湛然彼約行人圓伏三惑所有觀行心精與諸佛究竟心精通而不隔㳷而無迹合為一體故當處湛然今約佛與衆生理性相同無時而不通㳷同而不同善須分別次明感應二初反明無感不應二初釋疑但諸佛無時不欲度生而衆生念念與之迷背或有疑曰我等衆生既常與諸佛心精通㳷是則日用應時時見佛臨終應各各往生今既不見不往通㳷之義安在故論主釋疑云云蓋諸佛與衆生性相近故無時不欲度生衆生與諸佛習相遠故念念與之迷背耳次引譬故勢至菩薩云一人專憶一人專忘若逢不逢或見非見一人專憶譬諸佛無時不欲度生一人專忘譬衆生念念與之迷背以佛欲度故若逢或見以生迷背故不逢非見次正明有感即應二初譬合母子相憶二初譬子若憶母如母憶時母子歷生不相違遠子若憶母者譬衆生念佛也如母憶時者譬念佛當親切不當疏泛疏泛而念如子之憶也不專必當如母憶子之時無處不思無時不念以喻念佛之心於三際時十方處莫不稱性而觀絶待而照果能如是則佛母生子從生至生不相違遠此中雖明感應道交實符始本一念學者知之次合若衆生心憶佛念佛現前當來必定見佛去佛不遠憶佛且約事為言念佛當約理而論約事則心心緣於淨境約理則念念契於本源如是則十六勝境次第而觀一心三觀圓融而照能如此憶念此世現前即得見佛捨身來世必臻品位蓋此人全體荷擔去佛不相遼遠矣次結勸功由天性正由一理平等天性相關故得任運苦與樂一理平等者衆生三性與諸佛三身不二也天性相關者此借世間法為譬天以陰陽五行化生萬物同一氣類故曰天地為一大天地人身為一小天地父之傳子亦以己之小天地而化生其子大小同氣父子同形骨血相符業類相召此天性之相關也生佛之道亦然同一體性共一覺源似天性相關之道諸佛慈悲常欲與樂而苦苟有機感扣即蒙起應皆自然而然故曰任運次釋成此宗四初明彌陀妙應已成況無量壽佛因中所發四十八願誓取極樂攝受有情今道果久成僧那久滿諸佛誓願慈悲雖皆平等然亦有泛有切有親有疏前明拔苦與樂功由天性且泛明諸佛莫不如此然以誓願言之諸佛與堪忍衆生泛而且疏惟我釋迦與彌陀因中同為伯仲慈悲偏愍娑婆故釋迦生五濁惡世折伏剛強彌陀出清泰樂攝受調順譬如嚴父慈母作之成之化道斯就蓋菩薩慈悲雖復平等誓願開合不無殊異合之惟是四弘開之則增減不一故藥師開為十二法藏開為四十八然在因但發僧那於始心今彌陀居果則終大悲以赴難妙應已成而妙感斯赴故彌陀慈悲切而更親也次勸衆生妙感當立二初勸勿疑故凡百衆生勿憂佛不來應世人念佛極所憂疑者我今雖念佛求生倘臨終佛不來接引豈不唐捐其功故勸云凡百念佛勿憂不應以生佛天性相關故彌陀誓願成就故次勸立宗但當生信憶念數數發願願生西方世人於淨土法門不欣樂者凡墮三失一者不信二者不念三者不願不信品數至多大約有三種一者全然不信外道有之二者但信有己佛不信有他佛禪人有之三者信有他佛不信己佛事相行人有之今論主勸人須己他兼信斯悟生佛不二也二者不念亦有三種一者全然不念悠悠凡夫有之二者念己而不念他禪人有之三者念他而不念己事相之人有之今論主勸人須己他並念斯悟念而無念也三者不願亦有三種一者全然不願悠悠凡夫有之二者願自成佛不願他佛攝成此禪人有之三者願他佛來迎不知己佛自往此事相人有之今論主勸人須己他並願斯悟生即無生也三譬生佛感應任運如磁石與針任運吸取磁石即慈母石也磁為鐵之母鐵為磁之子此無情中亦天性相關氣分相攝任運而然不假勉強以喻彌陀無緣慈悲為衆生之慈母感應道交無差忒者也四明生佛感應難易三初借譬感應合否然磁能吸鐵而不能吸銅針能合磁而不能合玉喻中以磁鐵例之銅玉以喻泛的親疏下合法中義甚明顯次合法誓願相關譬猶佛能度有緣而不能度無緣衆生易感彌陀而不易感諸佛豈非生佛誓願相關者乎佛能度有緣不能度無緣如磁能吸鐵不能吸銅衆生易感彌陀而不易感諸佛如針能合磁而不能合玉今彌陀佛與我釋迦自為大通智勝十六王子以來恆在娑婆憐愍衆生慈悲誓願者深與物結緣者衆行行填願者久攝取佛土者勝憶念衆生者切神通力用者大天性相關非淺淺也三結顯當具三要是以求生淨土者信行願三缺一不可信行願三名為往生三要要者緊要謂此三皆是往生緊要一不可緩又要領如衣之領如裳之要提領而衣來舉要而裳至蓋行無信不立信無行不成二法無願又無約束信喻船之點首行如船之櫓棹願如船之尾柁三者俱備往生淨土必矣次二門明時處不隔二初一門約處論妙次一門約時論妙初中二初標九彼此恆一門彼指極樂此指娑婆彼此淨穢雖殊不外當人一念故稱恆一次釋二初述偈立宗若人臨終時能不失正念或見光見華已受寶池生淨業辦於一生正念主於臨去此古人所謂平居念正臨終安得不正此得之於上者也平居散心稱佛臨終攝散歸定此得之於中者也凡愚惡逆衆生善友勉勵歸正此得之於下者也淨土法門不必盡然但得臨終一念歸正華池九品俱預法流然有雖正念而絶無聞見識託蓮華者又有業牽冥界判決往生者不在此論今明彼此恆一正在此土臨終見光見華已受彼土寶池化生苟非恆一焉臻此妙次依宗釋義三初約事驗以立根本論曰彼生傳云張抗仕石晉為翰林學士課大悲呪十萬遍願生西方一日寢疾惟念佛號忽謂家人曰西方淨土秪在堂屋西邊阿彌陀佛坐蓮華上見翁兒在蓮華池金沙地上禮拜嬉戲良久念佛而化翁兒抗之孫也張抗舉往生人課大悲呪指往生行願惟念佛號指正念之由蓋臨終苦逼無暇誦呪惟佛號省力易成正念謂家人語正明彼此恆一之驗有人疑此是魔事者皆由不知惟心淨土之理故也或問曰所見蓮華是淨土相若翁兒亦在其中此兒生耶死耶若死無有行願云何往生若生豈有生人同居蓮界皆不然也答曰別本載翁兒三歲而亡或是再來之人往昔行願早已成就捨此餘生以託彼土或承乃祖呪願力故經云沾持呪人飄身之風浴身之水尚得往生何況親承呪願之力者乎次約心性以泯能所二明土居心內所以爾者蓋西方極樂世界乃吾心中之一土耳娑婆世界亦吾心中之一土耳釋張抗往生之相以成彼此恆一之理娑婆極樂淨穢雖殊能具之心彼此焉異次明心無遠近約土而言有十萬億彼此之異約心而觀原無遠近約土而言乃全性而相故異約心而言乃全相而性故同即之常分派之常合異焉同焉存之可也亡之亦可也況心即三性具足廣大清淨尚何彼此淨穢之殊異哉三約果相以絶去來三初釋妨但衆生自受生以來為五陰區局真性不契心源或有妨云淨土惟心誰人不具即目可見何待臨終故釋之受生以來有遠有近區局真性有淺有深遠則無始近則此生淺則色陰深則五陰今且一往就此生為色陰區宇局此真性不契心源何也蓋往生之人凡多聖少居凡夫地破陰為難今橫論五根悉為色陰所蔽是以見不超色聞不出聲乃至眼耳遠不見聞謂之區局真性不契心源也次正明念佛之人果報成熟將捨現陰趣生陰時淨土蓮華忽然在前惟心境界非有去來彼此之相初二句明淨業成就次二句明隨業受生次二句明印壞文成次三句以惟心泯其妄相既曰將捨現陰趣生陰時未破五陰明矣蓮華在前者色陰堅固妄想雖然未破此身幻化之相將離則眼不為色區耳不為聲區十萬億剎之遐方忽然在前此皆惟心境界豈有去來彼此之相可得哉三引證二初楞嚴故首楞嚴經云臨命終時未捨暖觸一生善惡俱時頓現純想即飛必生天上若飛心中兼福兼慧及與淨願自然心開見十方佛一切淨土隨願往生人之受生以識息暖三和合而成經云未捨暖觸正將終未終之時色陰將捨未捨之際一生所作善之與惡一時現前惡則純情而墜善則純想而飛善惡雜修則情想升沉兼有如經所説其相甚明所飛心中兼福兼慧者福則助修慧則念佛共為淨業及與淨願者加之以發願求生自然心開見十方佛一切淨土隨願往生正因色捨而不隔也以此例知若沉心中兼謗三寶及與惡願亦必自然心開見閻摩王一切地獄隨願往生以捨色陰故中陰衆生皆得五通職此之由也次妙宗法智大師云須知垂終自見坐金蓮身已是彼國生陰亦此意也天台大師觀經疏云及其瞑目告終上珍臺而高踊文成印壞坐金蓮而化生初句可知次句文成印壞者大經二十七云譬如蠟印印泥印與泥合印滅文成以喻凡夫現在陰滅中有陰生法智大師云今借此文以喻往生菩薩此土陰滅彼土陰生須知垂終自見坐金蓮華身已是彼國生陰故也次一門約時論妙二初標十現未互在門楞伽經云初生即有滅不為愚者説故教中有云剎那九世一念三千又云十世古今始終不離於當念又華嚴經云一念普觀無量劫無去無來亦無住皆現未互在之義也次釋二初述偈立宗行者今念佛功德不唐捐因中已有果如蓮華開敷初二句明念佛之人功無虗棄第三句釋其所以第四句以喻況顯次依宗釋義二初明由因感果論曰圓頓教人頓悟心性無修而修修彼樂性中所具極樂由修顯發夫念佛是同教判偏圓功收漸頓者皆由悟與不悟圓與不圓以分漸頓爾今明圓頓教人最初頓悟心性生心即佛心因源超果海悟心具則無法不具悟性量則無土不周悟性體則無生無滅既悟之矣正當進修雖修而仍了無修乃無修而修修彼樂蓋性中雖具全體在迷若不圓修則所具極樂無有顯發故圓頓教人謂之無作妙行也次明因果相即二初約性具明即二即性體明即初中三初立本而此心性竪貫三際橫裹十虗佛法生法正法依法因法果法一念圓成而此心性指上所頓悟者竪貫三際約性體而言橫裹十虗約性量而言佛法生法等約性具而言佛法即佛界生法即九界正法即實法一千依法即國土一千已上皆約理即而言因法約名字等四即而言果法約究竟即而言六種判即不離性具所攝雖多現在根塵相對心起一念圓成衆生法與心法豈不妙乎次釋成是以念佛之人名為全性起修全修在性全性起修雖名為因全修在性因中有果以所具因法與所具果法同居一性心性融通無法不攝念佛之人通舉凡位因位悟與不悟凡有所修皆名全性起修全修在性蓋真如不變之體能隨染淨緣以為隨緣之用雖悟與不悟不同其不變之體則一今圓教人已開圓解能了達乎此全性起修在修言之謂之為因全修在性性上言之豈不因中有果以所具因法等者釋成因中有果所具因法即性具九界所具果法即性具佛界既同居一心心性融通無法不攝亦無法不趣是故娑婆衆生念佛之因已有極樂九品之果三譬顯故如蓮華開敷華中有果法華經題妙法二字取譬蓮華如來立義甚深天台玄説極長略而言之通譬本迹謂迹本二門各有三喻今但取蓮華開敷以喻念佛全性起修之因華中有果以喻九品全修在性之果華果同時修性不二而已次即性體明即三初標況此心常住無生滅去來即今念佛之心便是當來華池受生之時前明性具相即雖有竪窮橫遍之言而正意在乎性具今則正明性體而亦兼得性量既此念佛之心常住無生滅去來豈不即今念佛之心便是當來華池受生之果華嚴云一念普觀無量劫無去無來亦無住斯言可徵矣次證驗故説初發心人極樂寶池已萌蓮種若精進不退日益生長華漸開敷隨其功德大小煒燁其或懈退悔雜日漸憔悴若能自新華復鮮麗其或未然芽焦種敗故説者引事證驗也即往生傳中雷峯辨才法師於禪定中神遊淨土見一華殊麗問之曰待淨慈本禪師者又資福曦公曰吾定中見金蓮華人言以待本公又見蓮華無數問之曰以待受度者或有萎者云是退墮人三結成且此蓮華人誰種植現未互在斯言有歸也娑婆蓮華由手種植以形而得乎形形骸有待故相去也近雖似近而反遠淨土蓮華由心種植以心而得乎心心性無待故相去也遠雖似遠而反近心既因中有果性又橫遍竪窮泯去來之相絶相待之形現未互在無足致疑跋語幽溪大師中興天台教觀以性具圓理弘闡淨土法門於萬曆癸卯因聞隱鱗居士請蕃為生無生論甲辰秋初開演於新昌石佛寺每一登座天樂盈空聲滿石室鏗鏘半月獨遘講時講畢聲寂日日如是遠近緇素咸歎希有海內名公著詩頌以紀之後又於括蒼諸處續復講演文心教法師録成親聞記二卷一梓於永嘉再梓於溫陵經今七八十年舊板不可復覩購獲為難茲吳興武康天泉寺雪萍健禪師向探少室宗乘研究己躬下事亦既稱脫頴矣後聞從上諸祖或兼弘念佛法門心焉慕之於乙亥秋來詣靈峯心懷注念於途中儼見接引聖容到山禮彌陀像恍然途中然所見也歎感應之奇緣知慈悲之切至即進堂隨衆聽講先師歇菴老人命卓崖定兄講演生無生論契入極則教理由是發心欲刻此論記以嘉惠後學慨記文或有繁訛處乃請紹曇成兄重加校閲以付剞氏爰述其緣起如此時康熙壬辰季冬朔北天目存西比丘真銘和南識
